backend = "gui"
data_dir = "data"

[gui]
enabled = false
# Local window OCR and exact visible chat-title verification.

[onebot]
url = "http://127.0.0.1:58080"
# Set WECHAT_ONEBOT_TOKEN or token_file before using the OneBot backend.
timeout = 20

[webhook]
host = "127.0.0.1"
port = 36060

[native]
enabled = false
# install-services.py configures this for an exactly supported ARM64 build.
# See native/wechat-*.json; never enable it for an unverified version.
# command = ["/absolute/path/.venv/bin/python", "/absolute/path/scripts/native-send.py"]
