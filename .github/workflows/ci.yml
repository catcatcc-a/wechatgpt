name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.2"
          python-version: "3.11"
          enable-cache: false
      - name: Verify runner and lockfile
        run: |
          test "$(uname -m)" = arm64
          node --version
          uv sync --locked
      - name: Check source and reachable Git history
        run: .venv/bin/python scripts/check_public_tree.py --history
      - name: Run tests without WeChat
        run: .venv/bin/python -m pytest -q
      - name: Compile optional GUI helper without running it
        run: |
          mkdir -p bin
          swiftc -O native/wechat_gui.swift -o bin/wechat-gui
      - name: Check whitespace
        run: git diff-tree --root --check -m HEAD
